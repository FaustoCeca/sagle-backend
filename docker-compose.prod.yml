# Stack de PRODUCCIÓN de Sagle backend.
#
# La imagen `sagle-backend:prod` se construye en la Mac (buildx, linux/amd64) y se
# transfiere al VPS con `docker save | ssh | docker load` — por eso NO hay sección
# `build:` acá: en el server se usa la imagen ya cargada.
#
# Dos archivos de entorno conviven en este directorio:
#   - .env       → SOLO para docker-compose (interpola ${POSTGRES_PASSWORD} acá abajo).
#   - .env.prod  → variables de la APP (inyectadas al contenedor backend con env_file).
# Ambos se crean en el VPS y nunca se commitean.

services:
  postgres:
    image: postgres:16
    container_name: sagle-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sagle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: sagle_prod
    volumes:
      - sagle_pgdata:/var/lib/postgresql/data
    # Sin `ports:` → la DB solo es accesible desde la red interna de compose,
    # nunca desde internet (y no choca con el Postgres nativo del host en :5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagle -d sagle_prod"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: sagle-backend:prod
    container_name: sagle-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod
    ports:
      # Publicado SOLO en loopback: Nginx (en el host) proxea hacia acá.
      - "127.0.0.1:3000:3000"

volumes:
  sagle_pgdata:
