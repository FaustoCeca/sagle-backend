name: Deploy Backend

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, staging]

env:
  NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  PM2_APP_NAME: ${{ github.ref == 'refs/heads/main' && 'backend-prod' || 'backend-staging' }}
  ENV_FILE: ${{ github.ref == 'refs/heads/main' && '.env.prod' || '.env.stgn' }}
  DEPLOY_PATH: ${{ github.ref == 'refs/heads/main' && '/root/projects/sagle-backend-prod' || '/root/projects/sagle-backend-stgn' }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS CLI globally
        run: npm install -g @nestjs/cli

      - name: Build project
        run: nest build

      - name: Generate Prisma Client
        run: npx prisma generate

      # Optional: Add tests here if needed
      # - name: Run tests
      #   run: npm test

      # Upload artifacts to share between jobs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            dist
            prisma
            package*.json
            node_modules
            # Include any other necessary files for deployment

  deploy:
    name: Deploy to Server
    needs: build # This makes the job wait for the build job to complete
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 146.190.147.241 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -avz --exclude '.git' \
                    --exclude '.github' \
                    --exclude '.env*' \
                    ./ root@146.190.147.241:${{ env.DEPLOY_PATH }}/

  configure:
    name: Configure and Restart Application
    needs: deploy # This makes the job wait for the deploy job to complete
    runs-on: ubuntu-latest
    steps:
      - name: Configure and restart application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 146.190.147.241
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            cp ${{ env.ENV_FILE }} .env
            npm ci --production
            npx prisma generate
            npx prisma migrate deploy
            
            # Check if the application is already registered in PM2
            if pm2 list | grep -q "${{ env.PM2_APP_NAME }}"; then
              pm2 restart ${{ env.PM2_APP_NAME }}
            else
              pm2 start dist/main.js --name "${{ env.PM2_APP_NAME }}"
            fi
            
            pm2 save