name: Deploy Backend

on:
  push:
    branches: [ main, staging ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, staging ]
      

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      PM2_APP_NAME: ${{ github.ref == 'refs/heads/main' && 'backend-prod' || 'backend-staging' }}
      ENV_FILE: ${{ github.ref == 'refs/heads/main' && '.env.prod' || '.env.stgn' }}
      DEPLOY_PATH: ${{ github.ref == 'refs/heads/main' && '/root/projects/sagle-backend-prod' || '/root/projects/sagle-backend-stgn' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS CLI globally
        run: npm install -g @nestjs/cli

      - name: Build project
        run: npm run build

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 146.190.147.241 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -avz --exclude 'node_modules' \
                    --exclude '.git' \
                    --exclude '.github' \
                    --exclude '.env*' \
                    ./ root@146.190.147.241:${{ env.DEPLOY_PATH }}/

      - name: Configure and restart application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 146.190.147.241
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            source ~/.bashrc
            source ~/.profile
            cd ${{ env.DEPLOY_PATH }}
            cp ${{ env.ENV_FILE }} .env
            npm ci --production
            npx prisma generate
            npx prisma migrate deploy
            
            # Verificar si la aplicación ya está registrada en PM2
            if pm2 list | grep -q "${{ env.PM2_APP_NAME }}"; then
              pm2 restart ${{ env.PM2_APP_NAME }}
            else
              pm2 start dist/main.js --name "${{ env.PM2_APP_NAME }}"
            fi
            
            pm2 save
